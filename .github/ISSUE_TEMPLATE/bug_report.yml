name: Bug Report
description: Report a reproducible defect in Snaxis (formerly Smart Clipping)
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please provide enough detail to reproduce it.

        Issues are public. Do not paste secrets or personal data, and report security
        problems privately instead (see SECURITY.md).

  - type: input
    id: addon_version
    attributes:
      label: Addon version
      placeholder: "2.1.1"
    validations:
      required: true

  - type: input
    id: blender_version
    attributes:
      label: Blender version
      placeholder: "4.0.x"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "Windows 11 / macOS 14 / Ubuntu 24.04"
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Snap To (sidebar panel) at the time of the issue
      options:
        - Same Mesh
        - Selected Objects
        - Visible Objects
        - Collection
    validations:
      required: true

  - type: input
    id: budget
    attributes:
      label: Snap Point Limit (sidebar panel > Limits and Display)
      placeholder: "50000"
    validations:
      required: true

  - type: dropdown
    id: search
    attributes:
      label: Snap Search (add-on preferences > Advanced)
      options:
        - Screen-space Grid (default)
        - 3D KD-tree (Experimental)
      default: 0
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Console logs
      description: Paste relevant Snaxis logs from Blender console.
      render: shell
    validations:
      required: false
