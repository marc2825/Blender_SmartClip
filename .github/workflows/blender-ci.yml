name: Blender CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  headless-tests:
    name: headless-tests (Blender ${{ matrix.blender }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # minimum supported / previous LTS / current LTS
        blender: ["4.0.2", "4.2.23", "5.2.4"]
    env:
      BLENDER_VERSION: ${{ matrix.blender }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Version Consistency Check
        run: python scripts/versioning.py

      - name: Install Blender Runtime Dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libx11-6 \
            libxrender1 \
            libxrandr2 \
            libxfixes3 \
            libxi6 \
            libxkbcommon0 \
            libxxf86vm1 \
            libsm6 \
            libegl1 \
            libgl1 \
            libdbus-1-3

      # download.blender.org sometimes rejects parallel downloads from CI
      # runners, so the archive is cached and mirrors are tried in turn.
      - name: Restore Blender Archive
        id: blender-cache
        uses: actions/cache@v6
        with:
          path: blender-${{ matrix.blender }}-linux-x64.tar.xz
          key: blender-${{ matrix.blender }}-linux-x64

      - name: Download Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          series="${BLENDER_VERSION%.*}"   # e.g. 4.0.2 -> 4.0
          archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          # Checksums always come from blender.org; mirrors only serve the archive.
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o blender.sha256 \
            "https://download.blender.org/release/Blender${series}/blender-${BLENDER_VERSION}.sha256"
          for base in \
              https://download.blender.org/release \
              https://mirrors.ocf.berkeley.edu/blender/release \
              https://ftp.nluug.nl/pub/graphics/blender/release; do
            if curl -fsSL --retry 3 --retry-all-errors --retry-delay 10 \
                  -o "${archive}" "${base}/Blender${series}/${archive}" \
                && grep " ${archive}\$" blender.sha256 | sha256sum -c -; then
              exit 0
            fi
            echo "::warning::Downloading ${archive} from ${base} failed; trying the next mirror"
            rm -f "${archive}"
          done
          exit 1

      - name: Install Blender
        shell: bash
        run: |
          set -euxo pipefail
          tar -xf "blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          echo "${PWD}/blender-${BLENDER_VERSION}-linux-x64" >> "${GITHUB_PATH}"

      - name: Sanity Check
        run: blender --version

      - name: Python Syntax Check
        run: |
          find smart_clipping tests scripts -name '*.py' -print0 \
            | xargs -0 python -m py_compile

      - name: Run Headless Addon Tests
        run: |
          blender \
            --background \
            --factory-startup \
            --python tests/headless_test_runner.py
