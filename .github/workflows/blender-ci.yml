name: Blender CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless-tests:
    name: headless-tests (Blender ${{ matrix.blender }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # minimum supported / previous LTS / current LTS
        blender: ["4.0.2", "4.2.23", "5.2.4"]
    env:
      BLENDER_VERSION: ${{ matrix.blender }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Version Consistency Check
        run: python scripts/versioning.py

      - name: Install Blender Runtime Dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libx11-6 \
            libxrender1 \
            libxrandr2 \
            libxfixes3 \
            libxi6 \
            libxkbcommon0 \
            libxxf86vm1 \
            libsm6 \
            libegl1 \
            libgl1 \
            libdbus-1-3

      # The archive and its blender.org checksum are cached per version and
      # verified again on every run (see the script).
      - name: Restore Blender Archive
        uses: actions/cache@v6
        with:
          path: |
            blender-${{ matrix.blender }}-linux-x64.tar.xz
            blender-${{ matrix.blender }}.sha256
          key: blender-${{ matrix.blender }}-linux-x64-v2

      - name: Download and Verify Blender
        run: bash .github/scripts/fetch-blender.sh "${BLENDER_VERSION}"

      - name: Install Blender
        shell: bash
        run: |
          set -euxo pipefail
          tar -xf "blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          echo "${PWD}/blender-${BLENDER_VERSION}-linux-x64" >> "${GITHUB_PATH}"

      - name: Sanity Check
        run: blender --version

      - name: Python Syntax Check
        run: |
          find smart_clipping tests scripts -name '*.py' -print0 \
            | xargs -0 python -m py_compile

      - name: Run Headless Addon Tests
        run: |
          blender \
            --background \
            --factory-startup \
            --python tests/headless_test_runner.py

      - name: Build and Install the Release ZIP
        shell: bash
        run: |
          set -euxo pipefail
          python scripts/package_addon.py --output-dir "${RUNNER_TEMP}/dist"
          user="${RUNNER_TEMP}/blender-user"
          BLENDER_USER_RESOURCES="${user}" \
          BLENDER_USER_SCRIPTS="${user}/scripts" \
          BLENDER_USER_CONFIG="${user}/config" \
            blender --background --factory-startup \
              --python tests/install_zip_test.py -- "${RUNNER_TEMP}"/dist/smart_clipping-v*.zip

      # Updating in place from 1.3.2 (the release commit, so it does not
      # depend on a release or tag) and switching off/on without a restart
      - name: Install the Release ZIP over 1.3.2
        shell: bash
        run: |
          set -euxo pipefail
          old=e46211e9b478a68be3db6bb40e7cd7a806130c40
          git fetch --depth=1 origin "${old}"
          git archive --format=zip --output="${RUNNER_TEMP}/smart_clipping-v1.3.2.zip" "${old}" smart_clipping
          user="${RUNNER_TEMP}/blender-user-upgrade"
          BLENDER_USER_RESOURCES="${user}" \
          BLENDER_USER_SCRIPTS="${user}/scripts" \
          BLENDER_USER_CONFIG="${user}/config" \
            blender --background --factory-startup \
              --python tests/install_zip_test.py -- \
                --upgrade-from "${RUNNER_TEMP}/smart_clipping-v1.3.2.zip" \
                "${RUNNER_TEMP}"/dist/smart_clipping-v*.zip
