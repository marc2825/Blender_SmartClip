name: Release Addon

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package (must match bl_info, e.g. 1.2.0); dry run, no release is created"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Release gate: the UI test on the oldest supported Blender and the current
  # LTS, with both snap search backends, at the commit being released.
  ui-tests:
    uses: ./.github/workflows/ui-tests.yml
    with:
      versions: '["4.0.2", "5.2.4"]'
      backends: '["GRID", "KDTREE"]'

  # The same UI test against the extension ZIP installed the way a user
  # would, on the oldest Blender that installs extensions and the current LTS.
  ui-tests-extension:
    uses: ./.github/workflows/ui-tests.yml
    with:
      versions: '["4.2.23", "5.2.4"]'
      backends: '["GRID"]'
      installed: true

  package-and-release:
    needs: [ui-tests, ui-tests-extension]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write     # create the GitHub release
    env:
      # Oldest supported Blender for each ZIP: they are installed into it
      # before release
      BLENDER_VERSION: "4.0.2"
      EXTENSION_BLENDER_VERSION: "4.2.23"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Addon Zip and Release Notes
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euxo pipefail
          mkdir -p dist
          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${INPUT_VERSION#v}"
          fi
          python scripts/versioning.py
          python scripts/package_addon.py --version "${VERSION}"
          python scripts/versioning.py --notes "${VERSION}" --output dist/RELEASE_NOTES.md
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Install Blender Runtime Dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y libx11-6 libxrender1 libxrandr2 libxfixes3 libxi6 \
            libxkbcommon0 libxxf86vm1 libsm6 libegl1 libgl1 libdbus-1-3

      - name: Restore Blender Archive
        uses: actions/cache@v6
        with:
          path: |
            blender-${{ env.BLENDER_VERSION }}-linux-x64.tar.xz
            blender-${{ env.BLENDER_VERSION }}.sha256
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64-v2

      - name: Restore Blender Archive (extensions)
        uses: actions/cache@v6
        with:
          path: |
            blender-${{ env.EXTENSION_BLENDER_VERSION }}-linux-x64.tar.xz
            blender-${{ env.EXTENSION_BLENDER_VERSION }}.sha256
          key: blender-${{ env.EXTENSION_BLENDER_VERSION }}-linux-x64-v2

      - name: Install the Legacy ZIP into Blender
        shell: bash
        run: |
          set -euxo pipefail
          bash .github/scripts/fetch-blender.sh "${BLENDER_VERSION}"
          tar -xf "blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          user="${RUNNER_TEMP}/blender-user"
          BLENDER_USER_RESOURCES="${user}" \
          BLENDER_USER_SCRIPTS="${user}/scripts" \
          BLENDER_USER_CONFIG="${user}/config" \
            "blender-${BLENDER_VERSION}-linux-x64/blender" --background --factory-startup \
              --python-exit-code 1 --python tests/install_zip_test.py -- "dist/snaxis-v${VERSION}.zip"

      - name: Validate and Install the Extension ZIP
        shell: bash
        run: |
          set -euxo pipefail
          bash .github/scripts/fetch-blender.sh "${EXTENSION_BLENDER_VERSION}"
          tar -xf "blender-${EXTENSION_BLENDER_VERSION}-linux-x64.tar.xz"
          blender="blender-${EXTENSION_BLENDER_VERSION}-linux-x64/blender"
          ext="dist/snaxis-v${VERSION}-extension.zip"
          "${blender}" --command extension validate "${ext}"
          user="${RUNNER_TEMP}/blender-user-extension"
          BLENDER_USER_RESOURCES="${user}" \
          BLENDER_USER_SCRIPTS="${user}/scripts" \
          BLENDER_USER_CONFIG="${user}/config" \
          BLENDER_USER_EXTENSIONS="${user}/extensions" \
            "${blender}" --background --factory-startup --python-exit-code 1 \
              --python tests/extension_install_test.py -- \
                --phase install "${ext}" "dist/snaxis-v${VERSION}.zip"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: smart_clipping-zip
          path: |
            dist/*.zip
            dist/*.sha256
            dist/RELEASE_NOTES.md
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        # Third-party action with write access: pinned to a commit (v3.0.4).
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: Snaxis ${{ github.ref_name }}
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/snaxis-${{ github.ref_name }}.zip
            dist/snaxis-${{ github.ref_name }}.sha256
            dist/snaxis-${{ github.ref_name }}-extension.zip
            dist/snaxis-${{ github.ref_name }}-extension.sha256
