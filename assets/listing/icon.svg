<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="icon-title">
  <title id="icon-title">Snaxis</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14202f"/>
      <stop offset="1" stop-color="#0d1520"/>
    </linearGradient>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#7fb2e5" stroke-opacity="0.1" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="256" height="256" rx="48" fill="url(#bg)"/>
  <rect width="256" height="256" rx="48" fill="url(#grid)"/>

  <!-- the guide both cubes stand on -->
  <line x1="18" y1="170" x2="238" y2="170" stroke="#ff3dff" stroke-width="4" stroke-dasharray="12 8" stroke-linecap="round"/>

  <!-- reference cube: edges and vertices -->
  <g fill="none" stroke="#9fb6cc" stroke-width="4" stroke-linejoin="round">
    <path d="M78 123.8 L118 100.7 L78 77.6 L38 100.7 Z"/>
    <path d="M38 100.7 L38 146.9 L78 170 L118 146.9 L118 100.7"/>
    <path d="M78 123.8 L78 170"/>
  </g>
  <g fill="#dbe7f3">
    <circle cx="78" cy="123.8" r="6"/><circle cx="38" cy="100.7" r="6"/><circle cx="118" cy="100.7" r="6"/>
    <circle cx="78" cy="77.6" r="6"/><circle cx="38" cy="146.9" r="6"/><circle cx="118" cy="146.9" r="6"/>
  </g>
  <circle cx="78" cy="170" r="8" fill="#ff3dff"/>

  <!-- moving cube (selected: orange), snapped onto the guide -->
  <g fill="none" stroke="#ffa033" stroke-width="4.5" stroke-linejoin="round">
    <path d="M186 133.1 L218 114.6 L186 96.2 L154 114.6 Z"/>
    <path d="M154 114.6 L154 151.5 L186 170 L218 151.5 L218 114.6"/>
    <path d="M186 133.1 L186 170"/>
  </g>
  <g fill="#ffc27a">
    <circle cx="186" cy="133.1" r="6"/><circle cx="154" cy="114.6" r="6"/><circle cx="218" cy="114.6" r="6"/>
    <circle cx="186" cy="96.2" r="6"/><circle cx="154" cy="151.5" r="6"/><circle cx="218" cy="151.5" r="6"/>
  </g>
  <circle cx="186" cy="170" r="18" fill="#00e5ff" opacity="0.55" filter="url(#glow)"/>
  <circle cx="186" cy="170" r="10" fill="#00e5ff"/>
</svg>
